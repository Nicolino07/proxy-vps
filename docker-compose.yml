services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"            # HTTP  (público, filtrado a Cloudflare por firewall.sh)
      - "443:443"          # HTTPS (público, filtrado a Cloudflare por firewall.sh)
      - "127.0.0.1:81:81"  # Panel admin: SOLO localhost. Acceso vía túnel SSH.
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      # CA de Cloudflare para Authenticated Origin Pulls (mTLS). Ver SECURITY.md
      - ./cloudflare/origin-pull-ca.pem:/etc/nginx/cloudflare/origin-pull-ca.pem:ro
    networks:
      - proxy-network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"  # Dashboard: SOLO localhost. Acceso vía túnel SSH.
    volumes:
      - ./uptime-kuma-data:/app/data
    networks:
      - proxy-network

  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    ports:
      - "127.0.0.1:19999:19999"  # Dashboard: SOLO localhost. Acceso vía túnel SSH.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      # Métricas por contenedor (CPU/RAM de cada app, no solo del host)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    driver: bridge

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
